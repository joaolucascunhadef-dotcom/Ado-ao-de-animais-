<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&display=swap" rel="stylesheet">
  <title>Sobre Patas — Adoção Consciente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #FFF8F0; color: #2A1A0A; line-height: 1.5; padding-bottom: 2rem; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; font-size: 1rem; }
    
    .conteudoPrincipal { max-width: 1000px; margin: 0 auto; padding: 0 1rem; }
    
    .botao { padding: .5rem 1rem; border-radius: 6px; font-weight: 600; }
    .botaoPrimario { background: #C85A1E; color: #fff; }
    .botaoContorno { border: 1px solid #ccc; background: #fff; }
    .botaoPerigo { background: #D9381E; color: #fff; }
    .botaoSucesso { background: #4E7A52; color: #fff; }

    nav { background: #FFFDC0; border-bottom: 1px solid #ddd; padding: .75rem 0; position: sticky; top: 0; z-index: 10; }
    .navegacaoInterna { display: flex; justify-content: space-between; align-items: center; }
    .logotipo { font-size: 1.5rem; font-weight: bold; color: #C85A1E; display: flex; align-items: center; gap: .4rem; }
    .iconeLogotipo { width: 24px; height: 24px; fill: #C85A1E; }

    #titulo { padding: 2.5rem 0; text-align: center; background: #fff; border-bottom: 1px solid #eee; margin-bottom: 2rem; }
    #titulo h1 { font-size: 2.2rem; margin-bottom: .5rem; color: #C85A1E; }

    .controlesBusca { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .controlesBusca input { padding: .5rem; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 200px; }

    .gradeAnimais { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .cartaoAnimal { background: #fff; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .cartaoAnimal img { width: 100%; height: 160px; object-fit: cover; }
    .corpoCartao { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: .5rem; }

    .topoCartao { display: flex; justify-content: space-between; align-items: center; }
    
    .botaoFavorito {
      background: #FFF0F5;
      border: 1px solid #FFC0CB;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .botaoFavorito:hover {
      transform: scale(1.15);
      background: #FFE4E1;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .botaoFavorito:active {
      transform: scale(0.95);
    }

    #painelOng { background: #F3E8D8; padding: 2rem 0; margin-top: 3rem; border-top: 1px solid #ddd; }
    .gradePainel { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .gradePainel { grid-template-columns: 1fr; } }
    
    .caixaPainel { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #ddd; }
    .grupoFormulario { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .25rem; }
    .grupoFormulario input, .grupoFormulario select, .grupoFormulario textarea { padding: .5rem; border: 1px solid #ccc; border-radius: 4px; }
    .itemGerenciamento { display: flex; justify-content: space-between; align-items: center; padding: .75rem; border-bottom: 1px solid #eee; }

    .janelaTela { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 20; }
    .janelaTela.ativo { display: flex; }
    .conteudoTela { background: #fff; padding: 1.5rem; border-radius: 8px; max-width: 400px; width: 90%; position: relative; }
    .botaoFechar { position: absolute; right: 1rem; top: .5rem; font-size: 1.5rem; cursor: pointer; }
    .alertaStatus { background: #FFF3CD; padding: .75rem; border-radius: 6px; margin-bottom: 1rem; font-size: .875rem; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <nav>
    <div class="conteudoPrincipal navegacaoInterna">
      <a href="#" class="logotipo">
        <svg class="iconeLogotipo" viewBox="0 0 100 100">
          <circle cx="28" cy="30" r="11"/>
          <circle cx="50" cy="20" r="11"/>
          <circle cx="72" cy="30" r="11"/>
          <path d="M 26,62 C 20,44 40,40 50,46 C 60,40 80,44 74,62 C 68,80 58,82 50,82 C 42,82 32,80 26,62 Z"/>
        </svg>
        Sobre Patas
      </a>
      <div id="botoesAutenticacaoNav">
        <button class="botao botaoContorno" onclick="abrirTelaAutenticacao('login')">Login ONG</button>
        <button class="botao botaoPrimario" onclick="abrirTelaAutenticacao('cadastro')">Cadastrar ONG</button>
      </div>
    </div>
  </nav>

  <section id="titulo">
    <div class="conteudoPrincipal">
      <h1>Todo animal merece um lar.</h1>
      <p>Conectamos animais abandonados a famílias amorosas.</p>
    </div>
  </section>

  <main class="conteudoPrincipal">
    <h2>Animais disponíveis</h2>
    <div class="controlesBusca">
      <input type="text" id="campoBusca" placeholder="Buscar por nome ou raça..." oninput="atualizarInterface()">
      <button class="botao botaoContorno" onclick="definirFiltro('todos')">Todos</button>
      <button class="botao botaoContorno" onclick="definirFiltro('gato')">Gatos</button>
      <button class="botao botaoContorno" onclick="definirFiltro('cao')">Cães</button>
    </div>

    <div class="gradeAnimais" id="gradeAnimais"></div>
  </main>

  <section id="painelOng">
    <div class="conteudoPrincipal">
      <h2>Painel da ONG</h2>
      
      <div id="alertaStatusAutenticacao" class="alertaStatus">
        <span>🔒 Faça login para cadastrar, editar ou excluir animais.</span>
        <button class="botao botaoPrimario" onclick="abrirTelaAutenticacao('login')">Login</button>
      </div>

      <div class="gradePainel">
        <div class="caixaPainel">
          <h3 id="tituloFormularioCrud">Cadastrar animal</h3>
          <form id="formularioCadastro" onsubmit="salvarDadosAnimal(event)">
            <input type="hidden" id="campoIdAnimal">
            <div class="grupoFormulario"><label>Nome</label><input type="text" id="campoNome" required></div>
            <div class="grupoFormulario"><label>Tipo</label>
              <select id="campoTipo"><option value="gato">Gato</option><option value="cao">Cão</option></select>
            </div>
            <div class="grupoFormulario"><label>Raça/Porte</label><input type="text" id="campoRaca" required></div>
            <div class="grupoFormulario"><label>URL da imagem</label><input type="url" id="campoImagem" placeholder="https://exemplo.com/foto.jpg"></div>
            <div class="grupoFormulario"><label>Descrição</label><textarea id="campoDescricao" rows="2" required></textarea></div>
            <div class="grupoFormulario"><label>Contato</label><input type="text" id="campoContato" required></div>
            <div style="display:flex; gap:.5rem;">
              <button type="submit" id="botaoEnviarCrud" class="botao botaoPrimario" style="flex:1;">Salvar</button>
              <button type="button" id="botaoCancelarCrud" class="botao botaoContorno" style="display:none;" onclick="resetarFormularioCrud()">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="caixaPainel">
          <h3>Animais no sistema</h3>
          <div id="listaGerenciamento"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="janelaTela" id="telaAutenticacao">
    <div class="conteudoTela">
      <span class="botaoFechar" onclick="fecharTela('telaAutenticacao')">&times;</span>
      <h3 id="tituloAutenticacao">Login ONG</h3>
      <form id="formularioAutenticacao" onsubmit="processarAutenticacao(event)" style="margin-top:1rem;">
        <div class="grupoFormulario" id="grupoCnpj" style="display:none;"><label>CNPJ</label><input type="text" id="campoCnpj"></div>
        <div class="grupoFormulario"><label>E-mail</label><input type="email" id="campoEmail" required></div>
        <div class="grupoFormulario"><label>Senha</label><input type="password" id="campoSenha" required></div>
        <button type="submit" id="botaoEnviarAutenticacao" class="botao botaoPrimario" style="width:100%;">Entrar</button>
      </form>
    </div>
  </div>

  <div class="janelaTela" id="telaDetalhes">
    <div class="conteudoTela">
      <span class="botaoFechar" onclick="fecharTela('telaDetalhes')">&times;</span>
      <img id="imagemDetalhes" src="" style="width:100%; height:150px; object-fit:cover; border-radius:4px;">
      <h3 id="nomeDetalhes" style="margin-top:.5rem;"></h3>
      <p id="racaDetalhes" style="color:#666; font-size:.8rem;"></p>
      <p id="descricaoDetalhes" style="margin:.5rem 0;"></p>
      <hr>
      <p style="margin-top:.5rem;"><strong>Contato:</strong> <span id="contatoDetalhes"></span></p>
    </div>
  </div>

  <script>
    let usuarioLogado = false;
    let filtroAtual = 'todos';
    let listaAnimais = [
      { id: 1, nome: "Bolinha", tipo: "gato", raca: "Siamês misturado", desc: "Muito carinhosa e calma.", contato: "ONG Patas do Bem — (31) 99876-5432", fav: false, img: "https://images.unsplash.com/photo-1583795128727-6ec3642408f8?w=300" },
      { id: 2, nome: "Rex", tipo: "cao", raca: "Vira-lata", desc: "Ativo, vacinado e brincalhão.", contato: "Abrigo Salvação — (31) 98765-4321", fav: false, img: "https://images.unsplash.com/photo-1526660690293-bcd32dc3b123?w=300" }
    ];

    const favoritosSalvos = JSON.parse(localStorage.getItem('meusFavoritos')) || [];
    listaAnimais.forEach(pet => { if (favoritosSalvos.includes(pet.id)) pet.fav = true; });

    function atualizarInterface() {
      renderizarAnimais();
      renderizarPainelGerenciamento();
    }

    function renderizarAnimais() {
      const termoBusca = document.getElementById('campoBusca').value.toLowerCase();
      const grade = document.getElementById('gradeAnimais');
      
      const animaisFiltrados = listaAnimais.filter(pet => 
        (filtroAtual === 'todos' || pet.tipo === filtroAtual) &&
        (pet.nome.toLowerCase().includes(termoBusca) || pet.raca.toLowerCase().includes(termoBusca))
      );

      grade.innerHTML = animaisFiltrados.length ? animaisFiltrados.map(pet => `
        <div class="cartaoAnimal">
          <img src="${pet.img}" alt="${pet.nome}">
          <div class="corpoCartao">
            <div class="topoCartao">
              <h3>${pet.nome}</h3>
              <button class="botaoFavorito" onclick="alternarFavorito(${pet.id})">${pet.fav ? '❤️' : '🤍'}</button>
            </div>
            <p style="font-size:.8rem; color:#666;">${pet.raca}</p>
            <button class="botao botaoContorno" onclick="abrirDetalhesAnimal(${pet.id})" style="margin-top:auto;">Ver Detalhes</button>
          </div>
        </div>
      `).join('') : '<p>Nenhum animal encontrado.</p>';
    }

    function renderizarPainelGerenciamento() {
      const listaGerenciamento = document.getElementById('listaGerenciamento');
      listaGerenciamento.innerHTML = listaAnimais.length ? listaAnimais.map(pet => `
        <div class="itemGerenciamento">
          <div><strong>${pet.nome}</strong> (${pet.tipo})</div>
          <div>
            ${usuarioLogado ? `
              <button class="botao botaoSucesso" onclick="prepararEdicaoAnimal(${pet.id})">Editar</button>
              <button class="botao botaoPerigo" onclick="deletarAnimal(${pet.id})">Excluir</button>
            ` : '<em style="font-size:.75rem; color:#666;">Requer Login</em>'}
          </div>
        </div>
      `).join('') : '<p>Nenhum animal cadastrado.</p>';
    }

    function salvarDadosAnimal(evento) {
      evento.preventDefault();
      if (!usuarioLogado) return alert('Faça login primeiro!'), abrirTelaAutenticacao('login');

      const idAnimal = document.getElementById('campoIdAnimal').value;
      const dadosNovos = {
        nome: document.getElementById('campoNome').value,
        tipo: document.getElementById('campoTipo').value,
        raca: document.getElementById('campoRaca').value,
        img: document.getElementById('campoImagem').value.trim() || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300",
        desc: document.getElementById('campoDescricao').value,
        contato: document.getElementById('campoContato').value
      };

      if (idAnimal) {
        Object.assign(listaAnimais.find(pet => pet.id == idAnimal), dadosNovos);
      } else {
        listaAnimais.push({ id: Date.now(), ...dadosNovos, fav: false });
      }

      resetarFormularioCrud();
      atualizarInterface();
    }

    function prepararEdicaoAnimal(id) {
      const pet = listaAnimais.find(item => item.id === id);
      if (!pet) return;
      document.getElementById('campoIdAnimal').value = pet.id;
      document.getElementById('campoNome').value = pet.nome;
      document.getElementById('campoTipo').value = pet.tipo;
      document.getElementById('campoRaca').value = pet.raca;
      document.getElementById('campoImagem').value = pet.img;
      document.getElementById('campoDescricao').value = pet.desc;
      document.getElementById('campoContato').value = pet.contato;
      document.getElementById('tituloFormularioCrud').innerText = 'Editar Animal';
      document.getElementById('botaoCancelarCrud').style.display = 'inline-block';
    }

    function deletarAnimal(id) {
      if (confirm('Deseja mesmo excluir?')) {
        listaAnimais = listaAnimais.filter(pet => pet.id !== id);
        atualizarInterface();
      }
    }

    function resetarFormularioCrud() {
      document.getElementById('formularioCadastro').reset();
      document.getElementById('campoIdAnimal').value = '';
      document.getElementById('tituloFormularioCrud').innerText = 'Cadastrar animal';
      document.getElementById('botaoCancelarCrud').style.display = 'none';
    }

    function alternarFavorito(id) {
      const pet = listaAnimais.find(item => item.id === id);
      if (pet) {
        pet.fav = !pet.fav;
        const idsFavoritos = listaAnimais.filter(item => item.fav).map(item => item.id);
        localStorage.setItem('meusFavoritos', JSON.stringify(idsFavoritos));
      }
      renderizarAnimais();
    }

    function definirFiltro(tipo) {
      filtroAtual = tipo;
      renderizarAnimais();
    }

    function abrirDetalhesAnimal(id) {
      const pet = listaAnimais.find(item => item.id === id);
      if (!pet) return;
      document.getElementById('imagemDetalhes').src = pet.img;
      document.getElementById('nomeDetalhes').innerText = pet.nome;
      document.getElementById('racaDetalhes').innerText = pet.raca;
      document.getElementById('descricaoDetalhes').innerText = pet.desc;
      document.getElementById('contatoDetalhes').innerText = pet.contato;
      document.getElementById('telaDetalhes').classList.add('ativo');
    }

    function abrirTelaAutenticacao(modo) {
      document.getElementById('tituloAutenticacao').innerText = modo === 'login' ? 'Login ONG' : 'Cadastrar ONG';
      document.getElementById('botaoEnviarAutenticacao').innerText = modo === 'login' ? 'Entrar' : 'Cadastrar';
      document.getElementById('grupoCnpj').style.display = modo === 'login' ? 'none' : 'flex';
      document.getElementById('telaAutenticacao').classList.add('ativo');
    }

    function fecharTela(idTela) {
      document.getElementById(idTela).classList.remove('ativo');
    }

    function processarAutenticacao(evento) {
      evento.preventDefault();
      usuarioLogado = true;
      
      document.getElementById('botoesAutenticacaoNav').innerHTML = `<button class="botao botaoContorno" onclick="location.reload()">Sair</button>`;
      
      const alerta = document.getElementById('alertaStatusAutenticacao');
      alerta.className = 'alertaStatus';
      alerta.style.background = '#D4EDDA';
      alerta.style.color = '#155724';
      alerta.innerHTML = '<span>✅ Sessão ONG ativa! Agora você pode gerenciar os animais.</span>';
      
      fecharTela('telaAutenticacao');
      document.getElementById('formularioAutenticacao').reset();
      atualizarInterface();
      alert('Autenticação realizada com sucesso!');
    }

    atualizarInterface();
  </script>
</body>
</html>
